<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Website{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-light bg-white border-bottom shadow-sm py-3">
        <div class="container d-flex align-items-center">
            <a href="{% url 'home' %}" class="btn btn-outline-primary px-4">Home</a>

            <div class="d-flex ms-5 gap-2 flex-wrap">
                <a href="{% url 'about_us' %}" class="btn btn-outline-secondary">About Us</a>
                <a href="{% url 'products' %}" class="btn btn-outline-secondary">Products</a>
                <a href="{% url 'contact' %}" class="btn btn-outline-secondary">Contact</a>
                <a href="{% url 'news' %}" class="btn btn-outline-secondary">News</a>

            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    {% block extra_script %}{% endblock %}
</body>
</html>
